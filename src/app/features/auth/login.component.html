<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="logo">TF</div>
      <h1>Bem-vindo ao TaskFlow</h1>
      <p class="subtitle">Gerencie suas tarefas de forma simples e reativa</p>
    </div>

    <!-- Mensagem de erro fake -->
    <div *ngIf="errorMessage" class="alert alert-error">
      <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <input 
          id="email"
          type="email" 
          formControlName="email" 
          class="form-control" 
          placeholder="exemplo@email.com"
          [class.is-invalid]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
        />
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['required']" class="error-text">
          O e-mail é obrigatório.
        </div>
        <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']" class="error-text">
          Digite um formato de e-mail válido.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input 
          id="password"
          type="password" 
          formControlName="password" 
          class="form-control" 
          placeholder="Mínimo de 6 caracteres"
          [class.is-invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        />
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['required']" class="error-text">
          A senha é obrigatória.
        </div>
        <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['minlength']" class="error-text">
          A senha precisa ter no mínimo 6 caracteres.
        </div>
      </div>

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Entrar</span>
        <span *ngIf="isLoading" class="spinner-small"></span>
      </button>
    </form>

    <div class="login-footer">
      <p>Estudo de migração para Angular 22</p>
      <span>NgModules • RxJS • Reactive Forms</span>
    </div>
  </div>
</div>
